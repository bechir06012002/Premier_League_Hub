[project]
name = "premier-league-hub"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "bechir06012002", email = "bechir.labcheg@supcom.tn" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "docling>=2.119.0",
    "feedparser>=6.0.14",
    "markdown>=3.10.3",
    "markdownify>=1.2.3",
    "openai>=3.0.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
premier-league-hub = "premier_league_hub:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
